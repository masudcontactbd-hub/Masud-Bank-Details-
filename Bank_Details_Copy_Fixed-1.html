<!DOCTYPE html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Bank Details</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial;background:#111;display:flex;align-items:center;justify-content:center;padding:15px;color:#f5d67b}.card{width:100%;max-width:500px;background:#1b1b1b;border:2px solid #d4af37;border-radius:20px;padding:25px}.row{display:flex;justify-content:space-between;align-items:center;background:#242424;padding:14px;border-radius:12px;margin:12px 0;gap:10px}label{font-weight:bold}.value{color:#fff;margin-top:5px}button{background:#d4af37;border:0;padding:10px 14px;border-radius:10px;font-weight:bold}button.copied{background:#4CAF50;color:#fff}</style></head><body><div class='card'><h2>✦ BANK DETAILS ✦</h2><div id='list'></div></div><script>
function fallbackCopy(t){let a=document.createElement('textarea');a.value=t;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();}
function copyToClipboard(t,b){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(t).catch(()=>fallbackCopy(t));}else{fallbackCopy(t);}let o=b.innerHTML;b.innerHTML='Copied!';b.classList.add('copied');setTimeout(()=>{b.innerHTML=o;b.classList.remove('copied');},1500);}
function add(l,v){document.getElementById('list').insertAdjacentHTML('beforeend',`<div class="row"><div><label>${l}</label><div class="value">${v}</div></div><button onclick="copyToClipboard('${v}',this)">Copy</button></div>`);}
add('Account Name','MD Masud Rana');add('Account Number','1061560000151');add('Routing Number','095261188');add('Bank','Eastern Bank Limited');add('Branch','Dhanmondi Branch');add('Account Type','Savings Account');
</script></body></html>
